[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftth-access"
version = "1.0.0"
description = "Prédiction de l'accès à la fibre optique (FTTH) des ménages au Togo"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alfred Kwami BIAM" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "scikit-learn>=1.5",  # PCA(svd_solver="covariance_eigh")
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "joblib>=1.2",
]

[project.optional-dependencies]
notebook = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "shap>=0.44",
    "scipy>=1.10",
    "jupyter>=1.0",
    "ipykernel>=6.17",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
]

[project.scripts]
ftth-train = "ftth_access.train:main"
ftth-predict = "ftth_access.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
